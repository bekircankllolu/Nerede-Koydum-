name: EAS Build

# Bu workflow'u GitHub'da Actions sekmesinden "Run workflow" ile elle
# başlatırsın. Bilgisayarında terminal gerekmez.
#
# Ön koşul: repo ayarlarında EXPO_TOKEN secret'i tanımlı olmalı.
# Token'ı expo.dev > Account settings > Access tokens sayfasından üretip
# Settings > Secrets and variables > Actions > New repository secret
# yolundan EXPO_TOKEN adıyla eklemelisin.
#
# iOS production build'i için ayrıca şu secret'lar gerekiyor (EAS
# dashboard'ının kimlik bilgisi sihirbazı sürekli sunucu hatası verdiği
# için credentials.json ile "local credentials" yoluna geçildi):
#   IOS_DIST_CERT_P12_BASE64      dağıtım sertifikası (.p12), base64
#   IOS_DIST_CERT_PASSWORD        o sertifikanın parolası
#   IOS_PROVISIONING_PROFILE_BASE64  .mobileprovision dosyası, base64

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Derlenecek platform
        type: choice
        default: android
        options:
          - android
          - ios
          - all
      profile:
        description: eas.json içindeki build profili
        type: choice
        default: preview
        options:
          - preview
          - preview-ios-simulator
          - development
          - production

jobs:
  build:
    name: ${{ inputs.platform }} / ${{ inputs.profile }}
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: EAS kur
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: iOS kimlik bilgilerini hazırla
        if: (inputs.platform == 'ios' || inputs.platform == 'all') && inputs.profile == 'production'
        run: |
          mkdir -p credentials
          echo "${{ secrets.IOS_DIST_CERT_P12_BASE64 }}" | base64 -d > credentials/distribution.p12
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 -d > credentials/profile.mobileprovision
          cat > credentials.json << 'JSON'
          {
            "ios": {
              "provisioningProfilePath": "credentials/profile.mobileprovision",
              "distributionCertificate": {
                "path": "credentials/distribution.p12",
                "password": "${{ secrets.IOS_DIST_CERT_PASSWORD }}"
              }
            }
          }
          JSON

      - name: Derle
        run: eas build --non-interactive --no-wait --platform ${{ inputs.platform }} --profile ${{ inputs.profile }}
